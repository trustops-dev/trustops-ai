research_questions:
  - rq_id: "RQ1"
    question: "Can structured execution-trace features improve AI failure classification over deterministic rules alone?"
    compared_methods: ["deterministic_rules", "multinomial_logistic_regression", "xgboost_classifier"]
    primary_metrics: ["macro_f1", "per_class_precision", "per_class_recall", "per_class_support", "confusion_matrix", "feature_importance"]
    falsifiable_null_policy: "No superiority is assumed in advance; negative or mixed findings where deterministic rules match or beat XGBoost remain valid research results."

  - rq_id: "RQ2"
    question: "Does combining deterministic, retrieval, and semantic evaluation signals agree with human-reviewed labels better than a single semantic/LLM evaluator?"
    compared_methods: ["semantic_llm_judge_alone", "deterministic_rules_plus_semantic", "full_evaluator_combination"]
    primary_metrics: ["cohens_kappa", "macro_f1", "disagreement_rate"]
    falsifiable_null_policy: "Evaluated against the offline human-reviewed subset (15-20% reviewed, 100-150 double-annotated); LLM-as-a-judge is never treated as ground truth."

  - rq_id: "RQ3"
    question: "Can trace evidence provide useful root-cause ranking for intentionally seeded AI failures?"
    compared_methods: ["failure_class_only_cause_mapping", "weighted_multi_evaluator_evidence_ranking"]
    primary_metrics: ["top_1_accuracy", "top_3_recall", "mrr"]
    falsifiable_null_policy: "RCA outputs are interpretable evidence scores (not calibrated probabilities) evaluated where causal ground truth (injected_root_cause or human review) exists."

  - rq_id: "RQ4"
    question: "Can trace-based evaluation detect deliberately introduced prompt/retrieval/agent regressions before release?"
    compared_methods: ["approved_baseline_configuration", "seeded_regression_candidate_configuration"]
    primary_metrics: ["regression_catch_rate", "false_block_rate", "per_category_delta"]
    falsifiable_null_policy: "Co-evaluated with Alaa's release gate runner on identical versioned datasets."

dataset_leakage_safeguards:
  default_split_ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  required_split_group_components: ["scenario_family", "question_template_id", "injection_recipe_id"]
  forbidden_inference_feature_keys:
    - "injected_failure"
    - "injected_failure_class"
    - "injected_root_cause"
    - "injection_recipe_id"
    - "injection_configuration"
    - "expected_critical_policy_result"
    - "expected_relevant_doc_ids"
    - "human_adjudicated_label"
    - "is_seeded_failure"
  paraphrase_grouping_rule: "All linguistic paraphrases derived from the same base scenario_family and question_template_id must remain inside the same split partition."
  test_freeze_rule: "Held-out test split must be frozen with an immutable dataset_version before final hyperparameter or threshold selection."
