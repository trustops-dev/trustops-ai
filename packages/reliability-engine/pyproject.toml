[project]
name = "trustops-reliability-engine"
version = "0.1.0"
description = "Evaluation, failure classification, and evidence-based diagnosis."
requires-python = ">=3.12,<3.13"
dependencies = ["trustops-contracts==0.1.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustops_reliability"]

[tool.hatch.build.targets.wheel.force-include]
"src/trustops_reliability/taxonomy/failure_taxonomy.yaml" = "trustops_reliability/taxonomy/failure_taxonomy.yaml"
