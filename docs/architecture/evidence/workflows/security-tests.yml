name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$install_dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $install_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan full fetched history for secrets
        run: gitleaks git . --log-opts="--all" --redact --no-banner
