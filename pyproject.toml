[project]
name = "trustops-ai"
version = "0.1.0"
description = "Development workspace for the TrustOps AI monorepo"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
audit = ["pip-audit==2.10.1"]
dev = [
    "hatchling==1.32.4",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20261030",
]

[tool.uv]
package = false
required-version = "==0.13.0"

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/instrumentation-sdk",
    "packages/platform-core",
    "packages/reliability-engine",
    "packages/governance-engine",
    "packages/mlops",
    "apps/api",
    "apps/procurement-agent",
    "apps/rag-assistant",
]

# Members declare their own dependencies as implementation is added.
# These sources ensure internal dependencies resolve from this workspace.
[tool.uv.sources]
trustops-contracts = { workspace = true }
trustops-instrumentation-sdk = { workspace = true }
trustops-platform-core = { workspace = true }
trustops-reliability-engine = { workspace = true }
trustops-governance-engine = { workspace = true }
trustops-mlops = { workspace = true }
trustops-api = { workspace = true }
trustops-procurement-agent = { workspace = true }
trustops-rag-assistant = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/contracts/src",
    "packages/instrumentation-sdk/src",
    "packages/platform-core/src",
    "packages/reliability-engine/src",
    "packages/governance-engine/src",
    "packages/mlops/src",
    "apps/api/src",
    "apps/procurement-agent/src",
    "apps/rag-assistant/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "tests"]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/packages/contracts/src",
    "$MYPY_CONFIG_FILE_DIR/packages/instrumentation-sdk/src",
    "$MYPY_CONFIG_FILE_DIR/packages/platform-core/src",
    "$MYPY_CONFIG_FILE_DIR/packages/reliability-engine/src",
    "$MYPY_CONFIG_FILE_DIR/packages/governance-engine/src",
    "$MYPY_CONFIG_FILE_DIR/packages/mlops/src",
    "$MYPY_CONFIG_FILE_DIR/apps/api/src",
    "$MYPY_CONFIG_FILE_DIR/apps/procurement-agent/src",
    "$MYPY_CONFIG_FILE_DIR/apps/rag-assistant/src",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"

[tool.importlinter]
root_packages = [
    "trustops_contracts",
    "trustops_sdk",
    "trustops_platform",
    "trustops_reliability",
    "trustops_governance",
    "trustops_mlops",
    "trustops_api",
    "trustops_procurement_agent",
    "trustops_rag_assistant",
]

[[tool.importlinter.contracts]]
name = "Reusable packages must not import applications"
type = "forbidden"
source_modules = [
    "trustops_contracts",
    "trustops_sdk",
    "trustops_platform",
    "trustops_reliability",
    "trustops_governance",
    "trustops_mlops",
]
forbidden_modules = ["trustops_api","trustops_procurement_agent","trustops_rag_assistant"]

[[tool.importlinter.contracts]]
name = "Contracts are the lowest shared layer"
type = "forbidden"
source_modules = ["trustops_contracts"]
forbidden_modules = [
    "trustops_sdk",
    "trustops_platform",
    "trustops_reliability",
    "trustops_governance",
    "trustops_mlops",
    "trustops_api",
    "trustops_procurement_agent",
    "trustops_rag_assistant",
]

[[tool.importlinter.contracts]]
name = "Reliability and governance share contracts, not implementations"
type = "independence"
modules = ["trustops_reliability", "trustops_governance"]

[[tool.importlinter.contracts]]
name = "Reliability and governance cannot depend on orchestration or instrumentation"
type = "forbidden"
source_modules = ["trustops_reliability", "trustops_governance"]
forbidden_modules = ["trustops_platform", "trustops_mlops", "trustops_sdk"]

[[tool.importlinter.contracts]]
name = "Instrumentation does not depend on backend implementation"
type = "forbidden"
source_modules = ["trustops_sdk"]
forbidden_modules = [
    "trustops_platform",
    "trustops_mlops",
    "trustops_reliability",
    "trustops_governance",
]
