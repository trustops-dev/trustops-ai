name: Python CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # --locked fails on missing/stale lockfiles; --no-editable exercises wheel packaging.
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups --no-editable

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check types
        run: uv run --no-sync mypy

      - name: Enforce import boundaries
        run: uv run --no-sync lint-imports --no-cache

      - name: Run unit and contract tests
        run: uv run --no-sync pytest tests/unit tests/contract
