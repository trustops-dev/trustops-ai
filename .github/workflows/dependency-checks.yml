name: Dependency security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install locked audit tools
        run: uv sync --locked --only-group audit --no-install-workspace

      - name: Export locked external dependencies from all workspace packages
        run: >-
          uv export --locked --all-packages --all-groups --all-extras
          --no-emit-workspace --format requirements-txt
          --output-file "$RUNNER_TEMP/trustops-requirements.txt" --quiet

      # Audit the exported pins without installing or resolving application packages.
      - name: Audit Python dependencies
        run: >-
          uv run --no-sync pip-audit
          --requirement "$RUNNER_TEMP/trustops-requirements.txt"
          --require-hashes --disable-pip --strict --progress-spinner off
